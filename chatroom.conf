# ============================================
#  ChatRoom 配置文件
#  修改后重启程序即可生效，无需重新编译
# ============================================

[server]
# 监听地址：0.0.0.0 = 监听所有网卡（本机回环 + 局域网均可连）
host = 0.0.0.0
port = 8080

[client]
# 客户端默认连接地址：
#   本机调试   -> 127.0.0.1
#   局域网联调 -> 改成服务器的局域网 IP（本机为 10.30.0.114）
host = 127.0.0.1
port = 8080
