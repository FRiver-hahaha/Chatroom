syntax = "proto3";

package chatroom;

message ChatMessage {
    uint32 type       = 1; 
    uint64 sender_id  = 2;
    uint64 target_id  = 3; 
    uint64 group_id   = 4; 
    uint64 timestamp  = 5;
    string token      = 6;

    oneof body {
        // 账号模块 1-99
        LoginRequest          login_req           = 10;
        LoginResponse         login_rsp           = 11;
        RegisterRequest       register_req        = 12;
        RegisterResponse      register_rsp        = 13;
        LogoutRequest         logout_req          = 14;
        LogoutResponse        logout_rsp          = 15;
        DeleteAccountRequest  delete_account_req  = 16;
        LogoutResponse        delete_account_rsp  = 17;

        // 好友模块 100-19
        FriendOpRequest       add_friend_req      = 20;
        FriendOpResponse      add_friend_rsp      = 21;
        FriendOpRequest       delete_friend_req   = 22;
        FriendOpResponse      delete_friend_rsp   = 23;
        FriendOpRequest       query_friend_req    = 24;
        FriendListResponse    query_friend_rsp    = 25;
        FriendOpRequest       block_friend_req    = 26;
        FriendOpResponse      block_friend_rsp    = 27;
        FriendOpRequest       unblock_friend_req  = 28;
        FriendOpResponse      unblock_friend_rsp  = 29;

        // 群组模块 200-299
        CreateGroupRequest    create_group_req    = 30;
        GroupOpResponse       create_group_rsp    = 31;
        GroupOpRequest        dismiss_group_req   = 32;
        GroupOpResponse       dismiss_group_rsp   = 33;
        GroupOpRequest        join_group_req      = 34;
        GroupOpResponse       join_group_rsp      = 35;
        GroupOpRequest        quit_group_req      = 36;
        GroupOpResponse       quit_group_rsp      = 37;
        GroupOpRequest        query_group_list_req = 38;
        GroupListResponse     query_group_list_rsp = 39;
        GroupOpRequest        query_group_members_req = 40;
        GroupMembersResponse  query_group_members_rsp = 41;
        GroupAdminRequest     add_group_admin_req     = 42;
        GroupOpResponse       add_group_admin_rsp     = 43;
        GroupAdminRequest     remove_group_admin_req  = 44;
        GroupOpResponse       remove_group_admin_rsp  = 45;
        GroupAdminRequest     approve_join_group_req  = 46;
        GroupOpResponse       approve_join_group_rsp  = 47;
        GroupAdminRequest     remove_group_member_req = 48;
        GroupOpResponse       remove_group_member_rsp = 49;
        GroupAdminRequest     reject_join_group_req  = 56;
        GroupOpResponse       reject_join_group_rsp  = 57;

        // 聊天模块 300-399
        ChatContent           private_chat_req    = 50;
        ChatResponse          private_chat_rsp    = 51;
        ChatContent           group_chat_req      = 52;
        ChatResponse          group_chat_rsp      = 53;
        HistoryRequest        get_history_req     = 54;
        HistoryResponse       get_history_rsp     = 55;

        // 好友模块扩展
        FriendOpRequest       query_blocked_req   = 70;
        FriendListResponse    query_blocked_rsp   = 71;

        // 文件发送模块 420-439
        FileSendRequest        file_send_req        = 80;
        FileSendResponse       file_send_rsp        = 81;
        FileTransfer           file_send_chunk_req  = 82;
        FileResponse           file_send_chunk_rsp  = 83;
        FileTransferNotify     file_transfer_notify = 84;
        FileTransferAcceptRequest  file_transfer_accept_req  = 85;
        FileTransferAcceptResponse file_transfer_accept_rsp  = 86;
        FileReceiveChunkRequest    file_receive_chunk_req    = 87;
        FileTransfer               file_receive_chunk_rsp    = 88;
        FileTransferStatusRequest  file_transfer_status_req  = 89;
        FileTransferStatusResponse file_transfer_status_rsp  = 90;
    }
}

// 账号模块

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    bool   success        = 1;
    string error_message  = 2;
    uint64 user_id        = 3;
    string username       = 4;
    string nickname       = 5;
    string token          = 6;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
    string nickname = 3;
}

message RegisterResponse {
    bool   success        = 1;
    string error_message  = 2;
    uint64 user_id        = 3;
    string username       = 4;
    string token          = 5;
}

message LogoutRequest {
    // string token      = 6;已经定义好了
}

message LogoutResponse {
    bool   success        = 1;
    string error_message  = 2;
}

message DeleteAccountRequest {
    string password = 1;
}

// 好友模块

message FriendOpRequest {
    uint64 target_user_id = 1;
}

message FriendOpResponse {
    bool   success        = 1;
    string error_message  = 2;
}

message FriendListResponse {
    bool   success        = 1;
    string error_message  = 2;
    repeated FriendInfo friends = 3;
}

message FriendInfo {
    uint64 user_id   = 1;
    string username  = 2;
    string nickname  = 3;
    bool   is_online = 4;
    bool   is_blocked = 5;
    uint64 add_time  = 6;
    uint64 streak_days = 7;  // 续火花天数
}

// 群组模块

message CreateGroupRequest {
    string group_name  = 1;
    string description = 2;
    bool   is_public   = 3;
}

message GroupOpResponse {
    bool   success        = 1;
    string error_message  = 2;
    uint64 group_id       = 3;
}

message GroupOpRequest {
    uint64 group_id = 1;
}

message GroupAdminRequest {
    uint64 group_id = 1;
    uint64 target_user_id = 2;
}

message GroupListResponse {
    bool   success           = 1;
    string error_message     = 2;
    repeated GroupInfo groups = 3;
}

message GroupInfo {
    uint64 group_id     = 1;
    string group_name   = 2;
    string description  = 3;
    uint64 owner_id     = 4;
    uint64 member_count = 5;
    bool   is_member    = 6;
    bool   is_public    = 7;
}

message GroupMembersResponse {
    bool   success              = 1;
    string error_message        = 2;
    repeated GroupMember members = 3;
}

message GroupMember {
    uint64 user_id    = 1;
    string username   = 2;
    string nickname   = 3;
    string role       = 4;  // "owner", "admin", "member"
    uint64 join_time  = 5;
}

// 聊天模块

message ChatContent {
    string payload = 1;  // 消息正文
}

message ChatResponse {
    bool   success        = 1;
    string error_message  = 2;
    string content        = 3;  
    string sender_name    = 4;  
}

message HistoryRequest {
    uint64 target_user_id = 1;  
    uint64 group_id       = 2; 
    int32  limit          = 3;  // 默认 50
}

message HistoryResponse {
    bool   success               = 1;
    string error_message         = 2;
    repeated MessageHistoryItem messages = 3;
}

message MessageHistoryItem {
    uint64 message_id  = 1;
    uint64 sender_id   = 2;
    string sender_name = 3;
    string content     = 4;
    uint64 timestamp   = 5;
    bool   is_read     = 6;
}

// 文件模块

message FileTransfer {
    string file_name = 1;
    uint64 file_size = 2;
    bytes  file_data = 3;  // 文件内容
    uint32 chunk_seq = 4;  // 断点续传分片序号（0 = 完整文件）
    uint32 total_chunks = 5;
    bytes  chunk_hash = 6; // SHA-256 of file_data (32 bytes)
}

message FileResponse {
    bool   success        = 1;
    string error_message  = 2;
    uint64 file_id        = 3;
    string file_name      = 4;
    uint64 file_size      = 5;
    bytes  file_data      = 6;
}

// 文件发送模块 (420-439)

message FileSendRequest {
    string file_name = 1;
    uint64 file_size = 2;
    uint32 total_chunks = 3;
    bytes  file_hash = 4;  // SHA-256 of complete file (32 bytes)
}

message FileSendResponse {
    bool   success        = 1;
    string error_message  = 2;
    uint64 transfer_id    = 3;
}

message FileTransferNotify {
    uint64 transfer_id  = 1;
    uint64 sender_id    = 2;
    string sender_name  = 3;
    string file_name    = 4;
    uint64 file_size    = 5;
    uint32 total_chunks = 6;
    bytes  file_hash    = 7;  // SHA-256 of complete file (32 bytes)
}

message FileTransferAcceptRequest {
    uint64 transfer_id = 1;
    bool   accept      = 2;
}

message FileTransferAcceptResponse {
    bool   success        = 1;
    string error_message  = 2;
}

message FileReceiveChunkRequest {
    uint64 transfer_id = 1;
    uint32 chunk_seq   = 2;
}

message FileTransferStatusRequest {
    uint64 transfer_id = 1;
}

message FileTransferStatusResponse {
    bool   success        = 1;
    string error_message  = 2;
    string file_name      = 3;
    uint64 file_size      = 4;
    uint32 total_chunks   = 5;
    repeated uint32 sender_received_chunks = 6;    // A 已上传的分片
    repeated uint32 receiver_received_chunks = 7;  // B 已接收的分片
    string status         = 8;  // "sending" | "completed" | "rejected"
    bytes  file_hash      = 9;  // SHA-256 of complete file (32 bytes)
}
